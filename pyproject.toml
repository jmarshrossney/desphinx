[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "desphinx"
version = "0.1.0.dev0"
description = "Catch reStructuredText and Sphinx markup in Python docstrings and comments, for projects documented with Markdown."
authors = [
    { name = "Joe Marsh Rossney", email = "17361029+jmarshrossney@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.scripts]
desphinx = "desphinx.cli:main"

[project.urls]
Homepage = "https://jmarshrossney.github.io/desphinx"
Repository = "https://github.com/jmarshrossney/desphinx"
Documentation = "https://jmarshrossney.github.io/desphinx"

# These bounds are floors, not pins: `uv sync` already resolves to the newest
# version each one allows, so raising them changes nothing for anyone. Do not
# "freshen" them, by hand or by bot. They exist only to stop resolution
# reaching for something ancient, and `[tool.uv] exclude-newer` below means a
# floor above the version that existed a week ago fails resolution outright.
# So these want to be low. Raise one only to reach a feature you need.
[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
    "rust-just>=1.57.0",
    {include-group = "docs"},
    {include-group = "test"},
]
docs = [
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.52",
]
test = [
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/", "tests/"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
# Ruff formats Python code blocks in Markdown, and would rewrite the
# pymdownx.snippets lines inside this page's python fences as expressions.
exclude = ["docs/index.md"]

[tool.ruff.lint]
# Ruff broadened its default rule set in 0.16, so always select explicitly:
# that way a version bump cannot change which rules apply.
select = [
    "E",   # pycodestyle errors
    "D",   # pydocstyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
    "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
# Exempt tests from docstring requirements.
"tests/**" = ["D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
# Resolve against the index as it was a week ago, so a same-day release cannot
# break a fresh `uv sync`. Note the corollary: a lower bound in
# [dependency-groups] must be at or below the version that existed a week ago,
# or resolution fails outright.
exclude-newer = "1 week"
